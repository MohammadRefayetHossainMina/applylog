<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApplyLog</title>
    <meta
      name="description"
      content="ApplyLog — log job applications, keep status current, and store notes in your browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <p class="eyebrow">Job application tracker</p>
        <h1>ApplyLog</h1>
        <p class="tagline">One list for every job application.</p>
      </div>
    </header>

    <main class="wrap">
      <p id="banner" class="banner" hidden role="status"></p>

      <section class="card">
        <h2>Add application</h2>
        <form id="add-form" class="stack-form">
          <div class="form-grid">
            <label>
              Company
              <input type="text" name="company" placeholder="Acme Corp" required />
            </label>
            <label>
              Role
              <input type="text" name="role" placeholder="Junior analyst" required />
            </label>
            <label>
              Date applied
              <input type="date" name="date_applied" required />
            </label>
            <label>
              Status
              <select name="status" required>
                <option value="applied" selected>applied</option>
                <option value="interview">interview</option>
                <option value="offer">offer</option>
                <option value="rejected">rejected</option>
              </select>
            </label>
          </div>
          <label>
            Notes (optional)
            <textarea name="notes" rows="3" placeholder="Referral, recruiter name, or next step"></textarea>
          </label>
          <button type="submit">Save application</button>
        </form>
      </section>

      <section class="card" id="edit-card" hidden>
        <h2>Edit application</h2>
        <dl class="meta">
          <div>
            <dt>Company</dt>
            <dd id="edit-company"></dd>
          </div>
          <div>
            <dt>Role</dt>
            <dd id="edit-role"></dd>
          </div>
          <div>
            <dt>Date applied</dt>
            <dd id="edit-date"></dd>
          </div>
        </dl>
        <form id="edit-form" class="stack-form">
          <input type="hidden" name="id" />
          <label>
            Status
            <select name="status" required>
              <option value="applied">applied</option>
              <option value="interview">interview</option>
              <option value="offer">offer</option>
              <option value="rejected">rejected</option>
            </select>
          </label>
          <label>
            Notes (optional)
            <textarea name="notes" rows="4"></textarea>
          </label>
          <div class="btn-row">
            <button type="submit">Save changes</button>
            <button type="button" class="secondary" id="edit-cancel">Cancel</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Applications</h2>
        <div id="list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
